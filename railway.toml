# railway.toml - Railway config for CollabDocs
# Free tier: $5/month credit (~500hrs), includes persistent volumes
# Deploy: Push to GitHub → Connect at railway.app → "New Project" → "Deploy from GitHub"

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "on-failure"
restartPolicyMaxRetries = 3

# Persistent volume for PGlite database
[[volumes]]
name = "collabdocs-data"
mountPath = "/data"
size = 1  # GB

[environments.production.variables]
NODE_ENV = "production"
PORT = "4000"
CLIENT_DIST = "/app/client/dist"
PGLITE_DIR = "/data"
COOKIE_SECURE = "true"
AUTH_RATE_LIMIT = "1000"
LOG_LEVEL = "info"
# JWT_SECRET will be auto-generated by Railway