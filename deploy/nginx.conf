# Round-robin load balancer in front of the CollabDocs instances.
# Deliberately NO sticky sessions: two people editing the same document usually land on
# different instances, and Redis pub/sub keeps them in sync.

worker_processes auto;
events {
  worker_connections 8192;
}

http {
  # Docker's DNS. Re-resolve instance names so a restarted container (new IP) gets traffic again.
  resolver 127.0.0.11 valid=5s ipv6=off;

  upstream collabdocs {
    zone collabdocs 64k;
    server app1:4000 max_fails=2 fail_timeout=5s resolve;
    server app2:4000 max_fails=2 fail_timeout=5s resolve;
    server app3:4000 max_fails=2 fail_timeout=5s resolve;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    client_max_body_size 2m;

    # Failover: if an instance is down, give up on it fast and retry the next one
    # (a WebSocket upgrade is a GET, so retrying it is safe).
    proxy_connect_timeout 2s;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 3;

    # Which instance answered? Handy when demoing the cluster.
    add_header X-Upstream $upstream_addr always;

    location /ws/ {
      proxy_pass http://collabdocs;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }

    location / {
      proxy_pass http://collabdocs;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
