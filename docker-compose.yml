# Full cluster: 3 CollabDocs instances behind nginx, sharing Postgres + Redis, with
# Prometheus + Grafana watching it.
#   docker compose up -d --build --wait
#     app       http://localhost:8080
#     grafana   http://localhost:3000   (dashboard "CollabDocs cluster", anonymous read-only)
#     prom      http://localhost:9090
# Instances are also exposed directly (4001-4003) for metrics and failover experiments.

x-app: &app
  build: .
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment: &app-env
    NODE_ENV: production
    DATABASE_URL: postgres://collabdocs:collabdocs@postgres:5432/collabdocs
    REDIS_URL: redis://redis:6379
    # Local demo only - set a long random secret in any real deployment.
    JWT_SECRET: ${JWT_SECRET:-local-cluster-secret-change-me}
    # Plain http on localhost; set to true behind TLS.
    COOKIE_SECURE: 'false'
    AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-1000}
    LOG_LEVEL: info

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: collabdocs
      POSTGRES_PASSWORD: collabdocs
      POSTGRES_DB: collabdocs
    command: ['postgres', '-c', 'max_connections=200', '-c', 'synchronous_commit=on']
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U collabdocs']
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      retries: 20

  app1:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app1
    ports: ['4001:4000']

  app2:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app2
    ports: ['4002:4000']

  app3:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app3
    ports: ['4003:4000']

  lb:
    image: nginx:1.27-alpine
    depends_on: [app1, app2, app3]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '8080:80'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/api/health']
      interval: 5s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'

  grafana:
    image: grafana/grafana:11.4.0
    depends_on: [prometheus]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/collabdocs.json
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '3000:3000'

volumes:
  pgdata:
